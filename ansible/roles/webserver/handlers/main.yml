---
- name: restart nginx
  ansible.builtin.service:
    name: "{{ nginx_service_name | default('nginx') }}"
    state: restarted

- name: reload nginx
  ansible.builtin.service:
    name: "{{ nginx_service_name | default('nginx') }}"
    state: reloaded

- name: restart chat-app
  ansible.builtin.service:
    name: chat-app
    state: restarted
